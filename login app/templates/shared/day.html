<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-shell">
        <div class="page-hero">
            <div class="back-button">
                <button type="button" onclick="history.back()">Back</button>
            </div>
            <div class="section-title">Daily Report</div>
            <h1>Attendance for {{ date }}</h1>
            <p>Review all student records saved for the selected attendance date.</p>
        </div>

        <div class="table-shell">
            <table>
                <thead>
                    <tr>
                        <th>Roll No</th>
                        <th>Name</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in data %}
                    <tr>
                        <td>{{ row[0] }}</td>
                        <td>{{ row[1] }}</td>
                        <td>{{ row[2] }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3" class="empty-copy">No attendance records found for this date.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
