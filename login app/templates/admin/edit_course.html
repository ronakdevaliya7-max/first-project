<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Course</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-shell">
        <div class="page-hero">
            <div class="section-title">Academic Structure</div>
            <h1>Edit Course</h1>
            <p>Refine the course name and description without leaving the premium admin workflow.</p>
            <div class="action-row">
                <a href="/courses" class="secondary-link">Courses List</a>
                <a href="/admin" class="secondary-link">Dashboard</a>
                <a href="/logout" class="secondary-link" onclick="return confirm('Are you sure you want to logout?')">Logout</a>
            </div>
        </div>
    </div>

    <div class="form-box">
        <form method="post">
            <label>Course Name</label>
            <input name="name" value="{{ course.name }}" required>

            <label>Description</label>
            <textarea name="description" rows="4">{{ course.description }}</textarea>

            <button type="submit" style="width:100%; margin-top:24px;">Update Course</button>
        </form>
    </div>
</body>
</html>
